[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "famgateway"
version = "1.0.3"
authors = [
  { name="ARYANISPE", email="support@famgateway.in" },
]
description = "Official Python SDK for FamGateway UPI Payment Gateway (by ARYANISPE)"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["famgateway", "upi", "payment-gateway", "fampay", "telegram-bot", "india", "npci", "aryanispe"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
"Homepage" = "https://famgateway.in"
"Documentation" = "https://famgateway.in/docs.php"
"Repository" = "https://github.com/aryanispe/famgateway-python"
"Bug Tracker" = "https://github.com/aryanispe/famgateway-python/issues"
